name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install LLVM 18 (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y llvm-18-dev libpolly-18-dev

      - name: Install LLVM 18 (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm@18

      - name: Install SDL2 and Binaryen (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libsdl2-dev binaryen lld

      - name: Install SDL2 and Binaryen (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2 binaryen

      - name: Set LLVM_SYS_180_PREFIX and PATH (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          echo "LLVM_SYS_180_PREFIX=/usr/lib/llvm-18" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

      - name: Set LLVM_SYS_180_PREFIX and PATH (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "LLVM_SYS_180_PREFIX=$(brew --prefix llvm@18)" >> "$GITHUB_ENV"
          echo "$(brew --prefix llvm@18)/bin" >> "$GITHUB_PATH"

      - name: Build runtime library
        run: cargo build -p gbasic-runtime-desktop

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: >
          cargo clippy --workspace --
          -D warnings
          -A clippy::collapsible_if
          -A clippy::missing_const_for_thread_local
          -A clippy::not_unsafe_ptr_arg_deref
          -A clippy::redundant_closure
          -A clippy::single_match
          -A clippy::needless_range_loop

      - name: Run tests
        run: cargo test --workspace
