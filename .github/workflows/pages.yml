name: Playground Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "playground/**"
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - "playground/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build playground artifact
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure playground endpoints
        env:
          GBASIC_COMPILE_URL: ${{ vars.GBASIC_COMPILE_URL }}
          GBASIC_TELEMETRY_URL: ${{ vars.GBASIC_TELEMETRY_URL }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const compileUrl = process.env.GBASIC_COMPILE_URL || "";
          const telemetryUrl = process.env.GBASIC_TELEMETRY_URL || "";

          fs.writeFileSync(
            "playground/config.js",
            [
              "// Generated by .github/workflows/pages.yml",
              `window.__GBASIC_COMPILE_URL = ${JSON.stringify(compileUrl)};`,
              `window.__GBASIC_TELEMETRY_URL = ${JSON.stringify(telemetryUrl)};`,
              "",
            ].join("\n"),
          );
          NODE

      - name: Validate static playground
        run: |
          test -f playground/index.html
          test -f playground/app.js
          test -f playground/style.css
          test -f playground/config.js
          test -f playground/assets/manifest.json
          test -f playground/lessons/manifest.json

          python3 -m http.server 4173 --directory playground &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          ready=
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          test -n "$ready"

          curl -fsS http://127.0.0.1:4173/config.js >/dev/null
          curl -fsS http://127.0.0.1:4173/assets/manifest.json >/dev/null
          curl -fsS http://127.0.0.1:4173/lessons/manifest.json >/dev/null

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: playground

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4
